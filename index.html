<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCo Hua Hin 88 - Luxury Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0f2f5; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); overflow-y: auto; }
    </style>
</head>
<body>
    <header class="bg-slate-900 text-white py-14 shadow-2xl border-b-4 border-yellow-600">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-3xl md:text-5xl font-bold tracking-tighter uppercase">AGENTFLOW 88 HUA HIN</h1>
            <p class="mt-3 text-yellow-500 uppercase text-sm tracking-[0.3em] font-light">Luxury Property Management System</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12">
        <div id="loading" class="text-center py-20 text-xl text-slate-400 animate-pulse font-light">กำลังเชื่อมต่อฐานข้อมูลระดับพรีเมียม...</div>
        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <div id="detailModal" class="modal">
        <div class="bg-white mx-auto my-5 md:my-10 rounded-[3rem] max-w-6xl shadow-2xl relative overflow-hidden">
            <button onclick="closeModal()" class="absolute top-6 right-6 bg-white text-slate-800 w-12 h-12 rounded-full z-50 shadow-2xl font-bold border border-gray-100 hover:bg-red-50 transition-colors">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // 🛑 สำคัญ: วาง Web App URL ที่ได้จาก Deploy ของคุณที่นี่
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzQOVdwb2eA-_qO0i0HQGteLTZ99NHlxY8gcvNH72eOrRRfIsV6lMnP6Lax0Rxg3D9v/exec";

        async function fetchProperties() {
            try {
                const response = await fetch(webAppUrl + "?action=getPublicCatalog");
                const result = await response.json();
                if (result.status === "success" && result.data.length > 0) {
                    displayProperties(result.data);
                } else {
                    document.getElementById('loading').innerText = "📭 พร้อมรับข้อมูลใหม่ในระบบ";
                }
            } catch (error) { 
                document.getElementById('loading').innerHTML = "⚠️ ไม่สามารถเชื่อมต่อระบบได้ <br> <span class='text-sm'>กรุณาตรวจสอบ URL ในโค้ด</span>"; 
            }
        }

        function displayProperties(properties) {
            const grid = document.getElementById('property-grid');
            document.getElementById('loading').style.display = 'none';
            grid.innerHTML = properties.map(item => `
                <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-50 transition-all hover:-translate-y-2 hover:shadow-2xl">
                    <div class="relative">
                        <img src="${item.Thumbnail_Image || 'https://via.placeholder.com/600x400?text=Waiting+for+Image'}" class="w-full h-72 object-cover" alt="Property">
                        <div class="absolute top-4 right-4 bg-yellow-500 text-white px-4 py-1.5 rounded-full text-[10px] font-bold shadow-lg">${item.Badge || 'LUXURY'}</div>
                    </div>
                    <div class="p-8 text-center">
                        <h3 class="text-2xl font-bold text-slate-800 mb-2">${item.HP_ID}</h3>
                        <p class="text-slate-400 text-sm mb-4 italic">${item.Project_Name || 'CoCo Hua Hin 88'}</p>
                        <p class="text-4xl font-bold text-slate-900 mb-8 leading-tight">฿${Number(item.Price || 0).toLocaleString()}</p>
                        <button onclick='showDetails(${JSON.stringify(item)})' class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold hover:bg-yellow-600 transition-all shadow-lg shadow-slate-200 uppercase tracking-widest text-xs">ดูข้อมูลเชิงลึก</button>
                    </div>
                </div>
            `).join('');
        }

        function showDetails(item) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            const images = item.Image_List ? item.Image_List.split(',') : [item.Thumbnail_Image];
            
            content.innerHTML = `
                <div class="flex flex-col lg:flex-row h-[90vh]">
                    <div class="lg:w-3/5 p-8 bg-slate-50 overflow-y-auto">
                        <h4 class="text-xl font-bold mb-6 text-slate-900 flex items-center gap-2">🖼️ อัลบั้มภาพโครงการ <span class="bg-slate-200 text-[10px] px-2 py-1 rounded-md font-mono">${images.length} รูป</span></h4>
                        <div class="grid grid-cols-1 gap-6">
                            ${images.map(img => `<img src="${img}" class="w-full rounded-[2rem] shadow-xl border-4 border-white hover:scale-[1.01] transition-transform cursor-zoom-in">`).join('')}
                        </div>
                    </div>
                    <div class="lg:w-2/5 p-10 overflow-y-auto flex flex-col border-l border-slate-100 bg-white">
                        <div class="flex-grow">
                            <h2 class="text-4xl font-bold text-slate-900 mb-2">${item.HP_ID}</h2>
                            <p class="text-yellow-600 font-bold mb-8 uppercase tracking-widest text-sm">${item.ID_NAME || 'Luxury Property'}</p>
                            
                            <div class="space-y-5 text-sm text-slate-600 border-t border-slate-100 pt-8">
                                <div class="flex justify-between items-center"><span class="font-light">Living Area:</span> <span class="font-bold text-slate-900">${item["Living Area (sq.m)"] || '-'} m²</span></div>
                                <div class="flex justify-between items-center"><span class="font-light">Bedrooms/Baths:</span> <span class="font-bold text-slate-900">${item.Bedrooms || 0}/${item.Bathrooms || 0}</span></div>
                                <div class="flex justify-between items-center"><span class="font-light">Plot Number:</span> <span class="font-bold text-slate-900">${item.Plot || '-'}</span></div>
                                <div class="mt-8">
                                    <p class="font-bold text-slate-900 mb-3 uppercase tracking-tighter">Description</p>
                                    <div class="bg-slate-50 p-6 rounded-3xl text-slate-500 italic leading-relaxed text-xs">
                                        ${item.Description || 'High-end residence in a private community.'}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-8 space-y-4">
                            <a href="${item.Map_Link || '#'}" target="_blank" class="block w-full bg-slate-100 text-slate-900 text-center py-5 rounded-2xl font-bold hover:bg-slate-200 transition-all text-xs uppercase tracking-widest">📍 Location on Maps</a>
                            <a href="tel:${item.Phone || '0812345678'}" class="block w-full bg-slate-900 text-white text-center py-5 rounded-2xl font-bold hover:bg-yellow-600 transition-all text-xs uppercase tracking-widest shadow-xl shadow-slate-100">📞 Contact Agent</a>
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() { document.getElementById('detailModal').style.display = "none"; document.body.style.overflow = "auto"; }
        window.onclick = (e) => { if (e.target.id === "detailModal") closeModal(); }
        fetchProperties();
    </script>
</body>
</html>
